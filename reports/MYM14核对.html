<!doctype html><meta charset="utf-8"><title>MYM-14 家具与柜体</title><style>body{font:18px/1.8 system-ui;max-width:850px;margin:50px auto}</style><h1>MYM-14 家具与柜体</h1><p>冰箱顶柜下接收口，消除视觉空隙。餐边柜为左三抽、右双门，开放格与上柜共用一块隔板。阳台家政柜下部双门、洗烘叠放，上部四门分两对。</p><p>木陌订单：夜弦黑色皮沙发2500mm，沙漏餐桌1100mm，白蜡木＋岩板，星木餐椅两把。圆桌放于卡座前。沙发深950mm、高860mm，桌高750mm为暂定显示值；款式按订单图片概括。电动展开尺寸未提供，本版仅收起状态。欧文休闲椅暂未放置，避免占用过道。</p><p>冰箱通风构造需最终型号确认，不以视觉封口代替安装要求。</p><a href="MYM13核对.html">入户柜上一版说明</a>
