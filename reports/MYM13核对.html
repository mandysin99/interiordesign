<!doctype html><meta charset="utf-8"><title>MYM-13 入户调整</title><style>body{font:18px/1.8 system-ui;max-width:850px;margin:50px auto;padding:24px}</style><h1>MYM-13 入户柜与冰箱</h1><p>交付阶段保留开发商原柜原饰面；第一阶段装修拆除并以木与梦木色重做，拆改层增加原柜引用。</p><p>原1100mm高柜分为左550mm鞋柜、右550mm分格家政柜，面向柜子定义左右。玄关落物台保留。可勾选“查看鞋柜／家政柜分格”隐藏柜门检查层板。</p><p>冰箱占位宽790、深600、高1925mm。左侧110mm仅为剩余空间预留，未扣散热、开门余量及薄抽五金柜板。家政柜沿用原柜约325mm深外轮廓，锅具与空气炸锅尺寸须另核。</p><p>双门把手移至成对中缝，左右门外侧铰接关系；当前模型不模拟柜门实际旋转。</p><p><a href="MYM12核对.html">上一版梳妆台调整</a></p>
