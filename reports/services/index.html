<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>水电核对 · DWG 阅读</title><style>*{box-sizing:border-box}body{margin:0;background:#f1f3ef;color:#243832;font:16px system-ui}header{padding:20px 24px;background:white;border-bottom:1px solid #ddd}h1{font-size:23px;margin:0 0 8px}p{margin:8px 0;line-height:1.6}.note{color:#7e571e;font-size:14px}nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}button,a{border:1px solid #ccd5ce;border-radius:8px;padding:9px 13px;background:white;color:inherit;cursor:pointer;font:inherit}button.active{background:#31564a;color:white}#canvas{height:70vh;overflow:auto;margin:12px;background:white;border:1px solid #ddd}img{display:block;width:100%;max-width:none;transform-origin:top left}summary{cursor:pointer}details{padding:10px 24px;background:#fff}#caption{font-size:14px}</style><header><h1>水电核对 · 原图独立视图</h1><p>可与装修阶段对照。这里保留 DWG 的真实图形，不把回路示意当成墙内走线路径。</p><nav><button data-key="water">给排水</button><button data-key="points">开关 / 智能点位</button><button data-key="lighting">照明回路</button><button data-key="ac">空调配电</button><button data-key="sockets">插座</button><button data-key="circuits">配电箱接线</button></nav><button id="minus">缩小 −</button> <button id="plus">放大 ＋</button> <button id="fit">适应宽度</button> <a href="水电核对版.pdf" target="_blank">打开完整 PDF ↗</a><p id="caption"></p><p class="note">点位和回路可核对；暗埋路径、埋深、排水坡度及现场改造条件未确认。模型空间与电气图户型题名不同，需核对实际交付。</p></header><div id="canvas"><img id="drawing" alt="DWG分层图纸"></div><details open><summary>书房改门 / 厨卫改位，先核对什么</summary><p>书房保留智能面板所在墙段；约1.9m门洞仍为方案值，不能从回路连接线推定暗埋线槽。先查面板进线方向及线路余量，再定门洞边界。</p><p>插座移位核对回路、负荷与供电；给水核对冷热水和阀门；排水核对立管、管径、坡度与降板。图中未标出的条件保持未知。</p></details><script>let width=100;const im=document.querySelector('#drawing');const names={"water": "给排水", "points": "开关 / 智能点位", "lighting": "照明回路", "ac": "空调配电", "sockets": "插座", "circuits": "配电箱接线"};document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{im.src=b.dataset.key+'.png';document.querySelectorAll('[data-key]').forEach(x=>x.classList.toggle('active',x===b));document.querySelector('#caption').textContent=names[b.dataset.key]+' · 可放大后滚动查看；尺寸以原图标注为准';});document.querySelector('#plus').onclick=()=>{width=Math.min(500,width+50);im.style.width=width+'%'};document.querySelector('#minus').onclick=()=>{width=Math.max(50,width-50);im.style.width=width+'%'};document.querySelector('#fit').onclick=()=>{width=100;im.style.width='100%'};document.querySelector('[data-key]').click();</script></html>
