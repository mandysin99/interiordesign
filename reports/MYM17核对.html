<!doctype html><meta charset="utf-8"><title>卡座与餐桌收拢</title><style>body{font:18px/1.8 system-ui;max-width:850px;margin:40px auto}</style><h1>MYM-17 卡座与桌椅</h1><p>卡座下柜、坐面、靠背及上方餐边吊柜，统一从过道墙端到厨房玻璃内侧，模型长约1727mm，后侧贴墙。吊柜为编织双门＋木双门。</p><p>1100mm圆桌向卡座推进200mm，两把餐椅向桌下推进500mm，并缩小前后间距。当前为不用餐时收起状态。</p><p>按当前模型护墙板正面与椅背最外沿，局部通行宽约620mm，已比原摆法增加约500mm，但仍偏紧；家具深度尚为暂值，不将此视作实测通行保证。</p><p><a href="MYM16核对.html">厨房视频核对</a></p>
