<!doctype html><meta charset="utf-8"><title>MYM-20 主卧柜体对齐</title><style>body{font:18px/1.8 system-ui;max-width:850px;margin:40px auto;padding:20px}</style><h1>主卧飘窗抽屉与衣柜对齐</h1><p>三段抽屉统一延伸至模型飘窗室内前沿，消除原先约90mm的后退。左中两段较低并保留共用抽出台板，右段较高。</p><p>落地衣柜和飘窗上柜共用柜门前平面；交接线同步移至飘窗前沿，飘窗上柜延伸至飘窗后沿。</p><p>本次按现有建筑模型调整相互关系，未改变建筑窗洞或吊顶标高。</p><p><a href="MYM19核对.html">查看此前开发商DWG厨房核对及未解决的尺寸差异</a></p><p><a href="/?v=mym20">返回模型</a></p>
