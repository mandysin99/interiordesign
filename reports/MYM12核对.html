<!doctype html><meta charset="utf-8"><title>MYM-12 主卧梳妆台核对</title><style>body{font:18px/1.8 system-ui;max-width:850px;margin:50px auto;padding:24px;color:#31443e}li{margin:14px 0}</style><h1>MYM-12 · 主卧飘窗梳妆台</h1><p>按最新说明纠正构造，椅子不再误建成柜体拱口。</p><ul><li>移除窗上方木板、右侧木饰板及假拱口，下方改为平直木饰面。</li><li>飘窗上为左、中、右三段抽屉，三段均与模型飘窗等深，约594mm。</li><li>左中抽屉较低，上方共用一块可抽出台板；右抽屉较高，不叠加抽出台板。</li><li>查看器勾选“主卧左中台板抽出”可对比收起与抽出状态；右段保持固定。</li></ul><p>三段宽度、柜高及抽出行程仍为模型示意；本次确认的是构造关系，未将其标记为施工复尺数据。</p><p><a href="MYM11核对.html">查看上一版衣柜、书柜及吊顶核对说明</a></p>
