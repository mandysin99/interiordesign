<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>叻叻小屋 · 两款地砖效果</title><style>body{max-width:1200px;margin:40px auto;padding:0 24px;font:17px/1.8 system-ui;color:#39372e;background:#f5f1e9}img{max-width:100%}a{color:#705339}.samples{display:flex;gap:24px}.samples figure{flex:1;margin:0}.samples img{height:320px;object-fit:contain}small{color:#686057}</style><a href="./">← 返回模型</a><h1>两款地砖搭配效果</h1><p>2026年11月3日确认：客厅与走廊使用罗浮威尔68183木纹砖；厨房使用郁金香AR3089H花砖。</p><a href="assets/materials/floor-comparison-20261103.jpg"><img src="assets/materials/floor-comparison-20261103.jpg" alt="客餐厅木纹砖与厨房郁金香花砖效果图"></a><p>这是基于现有住宅模型的材质渲染，不是现场实拍。木纹按照片近似；花砖使用用户产品图，单砖暂按300毫米。图中家具与光照细节比网页预览更丰富。点击图片可放大。</p><div class="samples"><figure><img src="assets/materials/68183-user-sample.jpg" alt="68183用户样板照片"><figcaption>68183 · 用户实物样板</figcaption></figure><figure><img src="assets/materials/AR3089H-reference.jpg" alt="AR3089H产品图"><figcaption>AR3089H · 两种郁金香花型</figcaption></figure></div><p>下一步：确认两款砖的规格、厚度、铺向、缝宽及厨房门口收口。入户与阳台仍沿用旧方案，是否统一为68183待确认。</p></html>
