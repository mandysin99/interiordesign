<!doctype html><meta charset="utf-8"><title>VB-01 GLB交接导出</title><script type="importmap">{"imports":{"three":"../assets/three.module.js"}}</script><h1>VB-01 · Blender视觉基准导出</h1><p>四个GLB，仅视觉模拟，不用于定制下单或施工放线。</p><button id="run">导出四个视觉基准GLB</button><pre id="status">等待开始</pre><script type="module">
import * as THREE from 'three';import {createModel} from '../src/model.js';import {addExisting} from '../src/existing.js';import {spatial} from '../src/spatial-data.js';import {GLTFExporter} from '../assets/GLTFExporter.js';
const variants=[['01_建筑保留基准_未封窗','delivery','unsealed'],['02_建筑保留基准_已封窗','delivery','sealed'],['03_定制家具参考_未封窗','furnished','unsealed'],['04_定制家具参考_已封窗','furnished','sealed']];
const status=document.querySelector('#status');document.querySelector('#run').onclick=async()=>{document.querySelector('#run').disabled=true;status.textContent='';try{for(const [label,phase,state] of variants){status.textContent+='正在导出 '+label+'\n';const m=createModel(spatial),e=addExisting(m,spatial);e.setPhase(phase);e.setEnclosure(state);e.setPanels(true);e.setHideCeilings(false);e.setZones(false);e.setHeightAudit(false);e.custom.setBed(false);e.custom.setVanity(false);m.roof.visible=true;m.setDoors(false);
m.root.name='VB-01_'+label;m.root.userData={version:'VB-01',purpose:spatial.handoff.purpose,units:'metres',upAxis:'Y',phase,enclosure:state,construction_calibrated:false,accepted_conditions:spatial.handoff.accepted_by_user,study_bed:'retracted',vanity:'retracted',doors:'closed'};
const semantic=(g,name,layer)=>{g.name=name;g.userData={...g.userData,semantic_layer:layer};g.traverse(n=>{if(n.isMesh)n.userData={...n.userData,stable_id:n.userData.id||n.name,semantic_layer:layer};});};
semantic(e.groups.architecture,'01_建筑底模','architecture');semantic(e.groups.retained,'02_开发商保留精装','retained');semantic(e.groups.design,'05_新增硬装','renovation');semantic(e.custom.group,'03_木与梦定制柜体','custom');semantic(e.custom.entryRenovation,'03_入户定制重做','custom');semantic(e.furnishings.group,'04_当前家具占位','furniture');semantic(e.enclosure,'06_新封窗_可独立移除','enclosure');m.roof.name='01_预览顶板_非实测层高';e.panels.name='02_中央顶面_高度待核';e.ceilings.name='02_边吊风口_位置标高待核';
m.root.updateMatrixWorld(true);const buffer=await new GLTFExporter().parseAsync(m.root,{binary:true,onlyVisible:true});const response=await fetch('/__freeze__/'+encodeURIComponent('VB-01_'+label+'.glb'),{method:'POST',headers:{'Content-Type':'model/gltf-binary'},body:buffer});if(!response.ok)throw Error(await response.text());status.textContent+='已保存 '+label+' '+buffer.byteLength+' bytes\n';}status.textContent+='全部四个GLB导出完成';}catch(err){status.textContent+='错误：'+err.message;document.querySelector('#run').disabled=false;}};
</script>
